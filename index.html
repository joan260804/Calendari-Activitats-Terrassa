    .subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .header-right {

      align-items: center; 
      gap: 20px; 
      flex-wrap: wrap; 
    }

    .logo-container {

      align-items: center;
    }

      width: auto; 
      object-fit: contain; 
      display: block;

    .lang-btn { background: transparent; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-muted); padding: 6px 14px; border-radius: 16px; transition: all 0.2s ease; }
    .lang-btn.active { background: var(--text-main); color: #ffffff; }

    .search-input:focus, .select-filter:focus, .date-filter:focus { border-color: var(--text-main); box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08); }

    .chip:hover { border-color: var(--text-main); color: var(--text-main); }
    .chip.active { background: var(--text-main); color: #ffffff; border-color: var(--text-main); }

    .counter { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .card { background: var(--card-bg); border-radius: var(--radius-md); padding: 22px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s ease, box-shadow 0.2s ease; overflow: hidden; }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: #cbd5e1; }

    function isFreePrice(priceText) {
      if (!priceText) return false;
      const str = priceText.toLowerCase();
      return str.includes('gratuït') || str.includes('gratuito') || str.includes('gratis') || /(^|[^\d])0\s*€/.test(str);
    }

    function extractPrices(priceText) {
      if (!priceText) return [];
      const matches = priceText.match(/\d+(?:,\d+)?/g);
      if (!matches) return [];
      return matches.map(n => parseFloat(n.replace(',', '.')));
    }

    function checkPriceMatch(priceText, rangeKey) {
      if (!rangeKey) return true;

      const isFree = isFreePrice(priceText);
      if (rangeKey === 'free') {
        return isFree;
      }

      if (isFree) return false;

      const prices = extractPrices(priceText);
      if (prices.length === 0) return false;

      let minR = 0, maxR = Infinity;
      if (rangeKey === '1-10') { minR = 1; maxR = 10; }
      else if (rangeKey === '11-20') { minR = 11; maxR = 20; }
      else if (rangeKey === '21-30') { minR = 21; maxR = 30; }
      else if (rangeKey === '31-40') { minR = 31; maxR = 40; }
      else if (rangeKey === '41-50') { minR = 41; maxR = 50; }
      else if (rangeKey === '51-max') { minR = 51; maxR = Infinity; }

      return prices.some(p => p >= minR && p <= maxR);
    }

                   .replace(/des de/g, 'desde')
                   .replace(/fins completar aforament/g, 'hasta completar aforo')
                   .replace(/reserva prèvia/g, 'reserva previa');
      } else {
        text = text.replace(/Gratuito/g, 'Gratuït')
                   .replace(/desde/g, 'des de')
                   .replace(/hasta completar aforo/g, 'fins completar aforament')
                   .replace(/reserva previa/g, 'reserva prèvia');
      }
      return text;
    }

        const categoryMatch = !category || 
          (item.categoria && item.categoria.toLowerCase().includes(category));

        const priceMatch = checkPriceMatch(item.precio, priceRange);

        const orgMatch = !selectedOrganizador || item.organizador === selectedOrganizador;
        const monthMatch = !month || (item.fecha && item.fecha.includes(month));

        let dateMatch = true;
        if (exactDate) {
          dateMatch = item.fecha === exactDate;
        } else if (startDate || endDate) {
          if (startDate && endDate) {
            dateMatch = item.fecha >= startDate && item.fecha <= endDate;
          } else if (startDate) {
            dateMatch = item.fecha >= startDate;
          } else if (endDate) {
            dateMatch = item.fecha <= endDate;
          }
        }

        return textMatch && categoryMatch && priceMatch && orgMatch && monthMatch && dateMatch;
      });

      filtered.sort((a, b) => {
        if (!a.fecha) return 1;
        if (!b.fecha) return -1;
        return a.fecha.localeCompare(b.fecha);
      });

      document.getElementById('activityCounter').innerText = `${filtered.length} ${t.counterSuffix}`;

      const grid = document.getElementById('eventsGrid');
      grid.innerHTML = filtered.map(item => {
        const badge = getOrganizadorBadge(item.organizador);
        
        let imgName = '';
        if (item.url) {
          const cleanUrl = item.url.replace(/\/$/, '');
          imgName = cleanUrl.substring(cleanUrl.lastIndexOf('/') + 1) + '.jpg';
        }

        const autoImgUrl = imgName ? `https://raw.githubusercontent.com/joan260804/Calendari-Activitats-Terrassa/main/img/${imgName}` : '';

        return `
        <div class="card">
          <div class="card-body-wrapper">
            <div class="card-tag">
              <span>${item.categoria || 'Esdeveniment'}</span>
              <span>${item.organizador}</span>
            </div>
            <div class="card-main-content">
              <div class="card-details">
                <h3 class="card-title">${item.actividad}</h3>
                <div class="card-info-list">
                  <div class="card-info">📅 ${formatFechaDisplay(item.fecha, item.dia)}</div>
                  <div class="card-info">🕒 ${item.hora || 'Consultar horari'}</div>
                  <div class="card-info">📍 ${item.lugar}</div>
                </div>
              </div>
              <div>
                ${autoImgUrl ? `
                  <img class="card-img-placeholder" 
                       src="${autoImgUrl}" 
                       alt="${item.actividad}" 
                       style="object-fit: cover;"
                       data-badge-bg="${badge.bg}"
                       data-badge-color="${badge.color}"
                       data-badge-text="${badge.text}"
                       onerror="handleImgError(this)">
                ` : `
                  <div class="card-img-placeholder" style="background-color: ${badge.bg}; color:${badge.color};">
                    ${badge.text}
                  </div>
                `}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <span class="badge-price">${formatPrecioDisplay(item.precio)}</span>
            <a href="${item.url}" target="_blank" rel="noopener" class="btn-link">${t.linkBtn}</a>
          </div>
        </div>
      `}).join('');
    }

    function formatFechaDisplay(fechaStr, diaStr) {
      if (!fechaStr) return 'Data per confirmar';
      const parts = fechaStr.split('-');
      if (parts.length < 3) return fechaStr;
      
      let dayName = diaStr;
      if (currentLang === 'es' && diaStr) {
        const daysMap = {
          'Dilluns': 'Lunes', 'Dimarts': 'Martes', 'Dimecres': 'Miércoles',
          'Dijous': 'Jueves', 'Divendres': 'Viernes', 'Dissabte': 'Sábado', 'Diumenge': 'Domingo'
        };
        dayName = daysMap[diaStr] || diaStr;
      }

      return `${dayName ? dayName + ', ' : ''}${parts[2]}/${parts[1]}/${parts[0]}`;
    }
  </script>
</body>
</html>
