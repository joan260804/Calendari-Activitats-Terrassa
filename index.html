<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Cultural de Terrassa</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #3b82f6;
      --badge-bg: #f1f5f9;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 32px 16px; line-height: 1.5; }
    .container { max-width: 1140px; margin: 0 auto; }
    
    /* Layout Header Alinear Título y Logo */
    .header-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 28px; 
      flex-wrap: wrap; 
      gap: 20px; 
    }

    .header-left { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      max-width: 600px;
    }
    
    h1 { font-size: 1.85rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
    .subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .header-right { 
      display: flex; 
      align-items: center; 
      gap: 20px; 
      flex-wrap: wrap; 
    }

    /* Ajuste de imagen sin pérdida de calidad */
    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo-img { 
      height: 48px; 
      width: auto; 
      object-fit: contain; 
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Selector de idioma */
    .lang-switcher { display: inline-flex; align-items: center; background: var(--card-bg); padding: 4px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .lang-btn { background: transparent; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-muted); padding: 6px 14px; border-radius: 16px; transition: all 0.2s ease; }
    .lang-btn.active { background: var(--text-main); color: #ffffff; }

    /* Contenedor de Filtros */
    .filter-section { background: var(--card-bg); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); margin-bottom: 24px; }
    
    .filters-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .search-input { grid-column: span 2; min-width: 240px; }
    @media (max-width: 768px) { .search-input { grid-column: span 1; } }

    .search-input, .select-filter, .date-filter { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--card-bg); color: var(--text-main); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .search-input:focus, .select-filter:focus, .date-filter:focus { border-color: var(--text-main); box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08); }

    .filters-dates { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid var(--border-color); padding-top: 16px; }
    .date-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    
    .btn-clear { margin-left: auto; padding: 10px 16px; background: var(--badge-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-clear:hover { background: #e2e8f0; }

    .filters-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .chip { padding: 8px 16px; border: 1px solid var(--border-color); border-radius: var(--radius-lg); background: var(--card-bg); font-size: 0.85rem; font-weight: 500; cursor: pointer; color: var(--text-muted); transition: all 0.2s; box-shadow: var(--shadow-sm); }
    .chip:hover { border-color: var(--text-main); color: var(--text-main); }
    .chip.active { background: var(--text-main); color: #ffffff; border-color: var(--text-main); }

    .counter { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border-radius: var(--radius-md); padding: 22px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: #cbd5e1; }
    
    .card-tag { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; gap: 8px; }
    .card-title { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 12px; line-height: 1.35; }
    
    .card-info-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .card-info { font-size: 0.875rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--border-color); margin-top: auto; }
    .badge-price { padding: 6px 12px; background: var(--badge-bg); border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 700; color: var(--text-main); }
    .btn-link { font-size: 0.85rem; font-weight: 600; color: var(--accent-color); text-decoration: none; transition: opacity 0.2s; }
    .btn-link:hover { opacity: 0.8; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div class="header-left">
        <h1 id="txt-title">Agenda Cultural de Terrassa</h1>
        <p class="subtitle" id="txt-subtitle">Programació de Terrassa Arts Escèniques, La Factoria Cultural i Festival TNT</p>
      </div>

      <div class="header-right">
        <div class="logo-container">
          <img class="logo-img" src="https://raw.githubusercontent.com/joan260804/Calendari-Activitats-Terrassa/main/logos.jpg" alt="Logos Ajuntament de Terrassa, LaFACT i TNT">
        </div>

        <div class="lang-switcher">
          <button class="lang-btn active" id="btn-ca" onclick="setLanguage('ca')">CAT</button>
          <button class="lang-btn" id="btn-es" onclick="setLanguage('es')">ESP</button>
        </div>
      </div>
    </div>

    <div class="filter-section">
      <div class="filters-top">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cercar per títol, espai...">
        
        <select id="categorySelect" class="select-filter">
          <option value="" id="opt-cat-all">Totes les categories</option>
          <option value="Teatre">Teatre / Teatro</option>
          <option value="Dansa">Dansa / Danza</option>
          <option value="Música">Música / Concerts</option>
          <option value="Familiar">Familiar / Kids</option>
          <option value="Monòlegs">Monòlegs / Comedia</option>
          <option value="Circ">Circ / Circo</option>
          <option value="Òpera">Òpera</option>
          <option value="Carrer">Carrer / Plazas</option>
          <option value="Performance">Performance / Instal·lació</option>
        </select>

        <select id="priceSelect" class="select-filter">
          <option value="" id="opt-price-all">Tots els preus</option>
          <option value="free" id="opt-price-free">Gratis / Gratuït</option>
          <option value="1-10">1 € - 10 €</option>
          <option value="11-20">11 € - 20 €</option>
          <option value="21-30">21 € - 30 €</option>
          <option value="31-40">31 € - 40 €</option>
          <option value="41-50">41 € - 50 €</option>
          <option value="51-max" id="opt-price-51">Més de 50 €</option>
        </select>

        <select id="monthSelect" class="select-filter">
          <option value="" id="opt-month-all">Tots els mesos</option>
          <option value="-09-" id="m-09">Setembre 2026</option>
          <option value="-10-" id="m-10">Octubre 2026</option>
          <option value="-11-" id="m-11">Novembre 2026</option>
          <option value="-12-" id="m-12">Desembre 2026</option>
          <option value="-01-" id="m-01">Gener 2027</option>
          <option value="-02-" id="m-02">Febrer 2027</option>
          <option value="-03-" id="m-03">Març 2027</option>
          <option value="-04-" id="m-04">Abril 2027</option>
          <option value="-05-" id="m-05">Maig 2027</option>
          <option value="-06-" id="m-06">Juny 2027</option>
        </select>
      </div>

      <div class="filters-dates">
        <div class="date-group">
          <span id="txt-lbl-exact">Data exacta:</span>
          <input type="date" id="dateInput" class="date-filter">
        </div>
        <div class="date-group">
          <span id="txt-lbl-from">Des de:</span>
          <input type="date" id="startDateInput" class="date-filter">
        </div>
        <div class="date-group">
          <span id="txt-lbl-to">Fins a:</span>
          <input type="date" id="endDateInput" class="date-filter">
        </div>
        <button class="btn-clear" id="btn-clear-txt" onclick="clearAllFilters()">🧹 Netejar filtres</button>
      </div>
    </div>

    <div class="filters-chips">
      <button class="chip active" id="chip-all" onclick="setOrganizador('')">Totes</button>
      <button class="chip" onclick="setOrganizador('Terrassa Arts Escèniques')">Terrassa Arts Escèniques</button>
      <button class="chip" onclick="setOrganizador('La Factoria Cultural')">La Factoria Cultural</button>
      <button class="chip" onclick="setOrganizador('Festival TNT')">Festival TNT</button>
    </div>

    <div class="counter" id="activityCounter">Carregant activitats...</div>

    <div class="grid" id="eventsGrid"></div>
  </div>

  <script>
    let currentLang = 'ca';

    const translations = {
      ca: {
        title: "Agenda Cultural de Terrassa",
        subtitle: "Programació de Terrassa Arts Escèniques, La Factoria Cultural i Festival TNT",
        searchPlaceholder: "🔍 Cercar per títol, espai...",
        catAll: "Totes les categories",
        priceAll: "Tots els preus",
        priceFree: "Gratis / Gratuït",
        price51: "Més de 50 €",
        monthAll: "Tots els mesos",
        lblExact: "Data exacta:",
        lblFrom: "Des de:",
        lblTo: "Fins a:",
        btnClear: "🧹 Netejar filtres",
        chipAll: "Totes",
        linkBtn: "Veure esdeveniment →",
        counterSuffix: "activitats disponibles",
        consult: "Consultar",
        m09: "Setembre 2026", m10: "Octubre 2026", m11: "Novembre 2026", m12: "Desembre 2026",
        m01: "Gener 2027", m02: "Febrer 2027", m03: "Març 2027", m04: "Abril 2027", m05: "Maig 2027", m06: "Juny 2027"
      },
      es: {
        title: "Agenda Cultural de Terrassa",
        subtitle: "Programación de Terrassa Arts Escèniques, La Factoria Cultural y Festival TNT",
        searchPlaceholder: "🔍 Buscar por título, espacio...",
        catAll: "Todas las categorías",
        priceAll: "Todos los precios",
        priceFree: "Gratis / Gratuito",
        price51: "Más de 50 €",
        monthAll: "Todos los meses",
        lblExact: "Fecha exacta:",
        lblFrom: "Desde:",
        lblTo: "Hasta:",
        btnClear: "🧹 Limpiar filtros",
        chipAll: "Todas",
        linkBtn: "Ver evento →",
        counterSuffix: "actividades disponibles",
        consult: "Consultar",
        m09: "Septiembre 2026", m10: "Octubre 2026", m11: "Noviembre 2026", m12: "Diciembre 2026",
        m01: "Enero 2027", m02: "Febrero 2027", m03: "Marzo 2027", m04: "Abril 2027", m05: "Mayo 2027", m06: "Junio 2027"
      }
    };

    const allData = [
      {
            "fecha": "2026-10-15",
            "dia": "Dijous",
            "hora": "20h",
            "actividad": "🎭 EVENTO DE PRUEBA: Gran Concierto de Test",
            "lugar": "Teatre Principal",
            "categoria": "Música",
            "precio": "10€",
            "organizador": "Terrassa Arts Escèniques",
            "url": "https://terrassaartsesceniques.cat"
      }
];

    let selectedOrganizador = '';

    document.addEventListener("DOMContentLoaded", () => {
      setLanguage('ca');
      
      document.getElementById('searchInput').addEventListener('input', renderEvents);
      document.getElementById('categorySelect').addEventListener('change', renderEvents);
      document.getElementById('priceSelect').addEventListener('change', renderEvents);
      document.getElementById('monthSelect').addEventListener('change', renderEvents);

      document.getElementById('dateInput').addEventListener('change', renderEvents);
      document.getElementById('startDateInput').addEventListener('change', renderEvents);
      document.getElementById('endDateInput').addEventListener('change', renderEvents);
    });

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById('btn-ca').classList.toggle('active', lang === 'ca');
      document.getElementById('btn-es').classList.toggle('active', lang === 'es');

      document.getElementById('txt-title').innerText = t.title;
      document.getElementById('txt-subtitle').innerText = t.subtitle;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('opt-cat-all').innerText = t.catAll;
      document.getElementById('opt-price-all').innerText = t.priceAll;
      document.getElementById('opt-price-free').innerText = t.priceFree;
      document.getElementById('opt-price-51').innerText = t.price51;
      document.getElementById('opt-month-all').innerText = t.monthAll;
      document.getElementById('txt-lbl-exact').innerText = t.lblExact;
      document.getElementById('txt-lbl-from').innerText = t.lblFrom;
      document.getElementById('txt-lbl-to').innerText = t.lblTo;
      document.getElementById('btn-clear-txt').innerText = t.btnClear;
      document.getElementById('chip-all').innerText = t.chipAll;

      document.getElementById('m-09').innerText = t.m09;
      document.getElementById('m-10').innerText = t.m10;
      document.getElementById('m-11').innerText = t.m11;
      document.getElementById('m-12').innerText = t.m12;
      document.getElementById('m-01').innerText = t.m01;
      document.getElementById('m-02').innerText = t.m02;
      document.getElementById('m-03').innerText = t.m03;
      document.getElementById('m-04').innerText = t.m04;
      document.getElementById('m-05').innerText = t.m05;
      document.getElementById('m-06').innerText = t.m06;

      renderEvents();
    }

    function setOrganizador(org) {
      selectedOrganizador = org;
      const t = translations[currentLang];
      document.querySelectorAll('.chip').forEach(btn => {
        if ((org === '' && (btn.innerText === t.chipAll || btn.innerText === 'Totes' || btn.innerText === 'Todas')) || btn.innerText === org) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderEvents();
    }

    function clearAllFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('categorySelect').value = '';
      document.getElementById('priceSelect').value = '';
      document.getElementById('monthSelect').value = '';
      document.getElementById('dateInput').value = '';
      document.getElementById('startDateInput').value = '';
      document.getElementById('endDateInput').value = '';
      
      selectedOrganizador = '';
      const t = translations[currentLang];
      document.querySelectorAll('.chip').forEach(btn => {
        if (btn.innerText === t.chipAll || btn.innerText === 'Totes' || btn.innerText === 'Todas') {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderEvents();
    }

    function isFreePrice(priceText) {
      if (!priceText) return false;
      const str = priceText.toLowerCase();
      return str.includes('gratuït') || str.includes('gratuito') || str.includes('gratis') || /(^|[^\d])0\s*€/.test(str);
    }

    function extractPrices(priceText) {
      if (!priceText) return [];
      const matches = priceText.match(/\d+(?:,\d+)?/g);
      if (!matches) return [];
      return matches.map(n => parseFloat(n.replace(',', '.')));
    }

    function checkPriceMatch(priceText, rangeKey) {
      if (!rangeKey) return true;

      const isFree = isFreePrice(priceText);
      if (rangeKey === 'free') {
        return isFree;
      }

      if (isFree) return false;

      const prices = extractPrices(priceText);
      if (prices.length === 0) return false;

      let minR = 0, maxR = Infinity;
      if (rangeKey === '1-10') { minR = 1; maxR = 10; }
      else if (rangeKey === '11-20') { minR = 11; maxR = 20; }
      else if (rangeKey === '21-30') { minR = 21; maxR = 30; }
      else if (rangeKey === '31-40') { minR = 31; maxR = 40; }
      else if (rangeKey === '41-50') { minR = 41; maxR = 50; }
      else if (rangeKey === '51-max') { minR = 51; maxR = Infinity; }

      return prices.some(p => p >= minR && p <= maxR);
    }

    function formatPrecioDisplay(precioStr) {
      if (!precioStr) return translations[currentLang].consult;
      let text = precioStr;
      if (currentLang === 'es') {
        text = text.replace(/Gratuït/g, 'Gratuito')
                   .replace(/des de/g, 'desde')
                   .replace(/fins completar aforament/g, 'hasta completar aforo')
                   .replace(/reserva prèvia/g, 'reserva previa');
      } else {
        text = text.replace(/Gratuito/g, 'Gratuït')
                   .replace(/desde/g, 'des de')
                   .replace(/hasta completar aforo/g, 'fins completar aforament')
                   .replace(/reserva previa/g, 'reserva prèvia');
      }
      return text;
    }

    function renderEvents() {
      const t = translations[currentLang];
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const category = document.getElementById('categorySelect').value.toLowerCase();
      const priceRange = document.getElementById('priceSelect').value;
      const month = document.getElementById('monthSelect').value;

      const exactDate = document.getElementById('dateInput').value;
      const startDate = document.getElementById('startDateInput').value;
      const endDate = document.getElementById('endDateInput').value;

      let filtered = allData.filter(item => {
        const textMatch = !search || 
          (item.actividad && item.actividad.toLowerCase().includes(search)) ||
          (item.lugar && item.lugar.toLowerCase().includes(search));

        const categoryMatch = !category || 
          (item.categoria && item.categoria.toLowerCase().includes(category));

        const priceMatch = checkPriceMatch(item.precio, priceRange);

        const orgMatch = !selectedOrganizador || item.organizador === selectedOrganizador;
        const monthMatch = !month || (item.fecha && item.fecha.includes(month));

        let dateMatch = true;
        if (exactDate) {
          dateMatch = item.fecha === exactDate;
        } else if (startDate || endDate) {
          if (startDate && endDate) {
            dateMatch = item.fecha >= startDate && item.fecha <= endDate;
          } else if (startDate) {
            dateMatch = item.fecha >= startDate;
          } else if (endDate) {
            dateMatch = item.fecha <= endDate;
          }
        }

        return textMatch && categoryMatch && priceMatch && orgMatch && monthMatch && dateMatch;
      });

      filtered.sort((a, b) => {
        if (!a.fecha) return 1;
        if (!b.fecha) return -1;
        return a.fecha.localeCompare(b.fecha);
      });

      document.getElementById('activityCounter').innerText = `${filtered.length} ${t.counterSuffix}`;

      const grid = document.getElementById('eventsGrid');
      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div>
            <div class="card-tag">
              <span>${item.categoria || 'Esdeveniment'}</span>
              <span>${item.organizador}</span>
            </div>
            <h3 class="card-title">${item.actividad}</h3>
            <div class="card-info-list">
              <div class="card-info">📅 ${formatFechaDisplay(item.fecha, item.dia)}</div>
              <div class="card-info">🕒 ${item.hora || 'Consultar horari'}</div>
              <div class="card-info">📍 ${item.lugar}</div>
            </div>
          </div>
          <div class="card-footer">
            <span class="badge-price">${formatPrecioDisplay(item.precio)}</span>
            <a href="${item.url}" target="_blank" rel="noopener" class="btn-link">${t.linkBtn}</a>
          </div>
        </div>
      `).join('');
    }

    function formatFechaDisplay(fechaStr, diaStr) {
      if (!fechaStr) return 'Data per confirmar';
      const parts = fechaStr.split('-');
      if (parts.length < 3) return fechaStr;
      
      let dayName = diaStr;
      if (currentLang === 'es' && diaStr) {
        const daysMap = {
          'Dilluns': 'Lunes', 'Dimarts': 'Martes', 'Dimecres': 'Miércoles',
          'Dijous': 'Jueves', 'Divendres': 'Viernes', 'Dissabte': 'Sábado', 'Diumenge': 'Domingo'
        };
        dayName = daysMap[diaStr] || diaStr;
      }

      return `${dayName ? dayName + ', ' : ''}${parts[2]}/${parts[1]}/${parts[0]}`;
    }
  </script>
</body>
</html>
