    .search-input { flex: 2; min-width: 220px; padding: 10px 16px; border: 1px solid #dcdcdc; border-radius: 8px; font-size: 0.95rem; background: #fff; outline: none; }
    .select-filter, .date-filter { flex: 1; min-width: 150px; padding: 10px 14px; border: 1px solid #dcdcdc; border-radius: 8px; font-size: 0.95rem; background: #fff; outline: none; cursor: pointer; }

    .btn-clear { padding: 10px 16px; background: #e0e0e0; color: #333; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-clear:hover { background: #d0d0d0; }

    .filters-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .chip { padding: 8px 18px; border: 1px solid #dcdcdc; border-radius: 20px; background: #fff; font-size: 0.9rem; cursor: pointer; color: #444; transition: all 0.2s; }
    .chip.active { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }

    .counter { font-size: 0.95rem; color: #444; margin-bottom: 20px; font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 18px; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .card-tag { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #888; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: #111; margin: 0 0 10px 0; line-height: 1.3; }
    .card-info { font-size: 0.9rem; color: #555; margin-bottom: 6px; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
    .badge-price { padding: 4px 10px; background: #f0f0f0; border-radius: 6px; font-size: 0.85rem; font-weight: 600; color: #333; }
    .btn-link { font-size: 0.85rem; font-weight: 600; color: #0066cc; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .btn-link:hover { text-decoration: underline; }
  </style>
</head>

    let selectedOrganizador = '';

    document.addEventListener("DOMContentLoaded", () => {
      renderEvents();
      
      document.getElementById('searchInput').addEventListener('input', renderEvents);
      document.getElementById('categorySelect').addEventListener('change', renderEvents);
      document.getElementById('monthSelect').addEventListener('change', renderEvents);
      document.getElementById('sortSelect').addEventListener('change', renderEvents);

      document.getElementById('dateInput').addEventListener('change', renderEvents);
      document.getElementById('startDateInput').addEventListener('change', renderEvents);
      document.getElementById('endDateInput').addEventListener('change', renderEvents);
    });

    function setOrganizador(org) {
      selectedOrganizador = org;
      document.querySelectorAll('.chip').forEach(btn => {
        if ((org === '' && btn.innerText === 'Todas') || btn.innerText === org) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderEvents();
    }

    function clearAllFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('categorySelect').value = '';
      document.getElementById('monthSelect').value = '';
      document.getElementById('sortSelect').value = 'asc';
      document.getElementById('dateInput').value = '';
      document.getElementById('startDateInput').value = '';
      document.getElementById('endDateInput').value = '';
      
      setOrganizador('');
    }

    function renderEvents() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const category = document.getElementById('categorySelect').value.toLowerCase();
      const month = document.getElementById('monthSelect').value;
      const sort = document.getElementById('sortSelect').value;

      const exactDate = document.getElementById('dateInput').value;
      const startDate = document.getElementById('startDateInput').value;
      const endDate = document.getElementById('endDateInput').value;

      let filtered = allData.filter(item => {
        const textMatch = !search || 
          (item.actividad && item.actividad.toLowerCase().includes(search)) ||
          (item.lugar && item.lugar.toLowerCase().includes(search));

        const categoryMatch = !category || 
          (item.categoria && item.categoria.toLowerCase().includes(category));

        const orgMatch = !selectedOrganizador || item.organizador === selectedOrganizador;
        const monthMatch = !month || (item.fecha && item.fecha.includes(month));

        let dateMatch = true;
        if (exactDate) {
          dateMatch = item.fecha === exactDate;
        } else if (startDate || endDate) {
          if (startDate && endDate) {
            dateMatch = item.fecha >= startDate && item.fecha <= endDate;
          } else if (startDate) {
            dateMatch = item.fecha >= startDate;
          } else if (endDate) {
            dateMatch = item.fecha <= endDate;
          }
        }

        return textMatch && categoryMatch && orgMatch && monthMatch && dateMatch;
      });

      filtered.sort((a, b) => {
        if (!a.fecha) return 1;
        if (!b.fecha) return -1;
        return sort === 'asc' ? a.fecha.localeCompare(b.fecha) : b.fecha.localeCompare(a.fecha);
      });

      document.getElementById('activityCounter').innerText = `${filtered.length} actividades disponibles`;

      const grid = document.getElementById('eventsGrid');
      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div>
            <div class="card-tag">
              <span>${item.categoria || 'Evento'}</span>
              <span>${item.organizador}</span>
            </div>
            <h3 class="card-title">${item.actividad}</h3>
            <div class="card-info">📅 ${formatFechaDisplay(item.fecha, item.dia)}</div>
            <div class="card-info">🕒 ${item.hora || 'Consultar horario'}</div>
            <div class="card-info">📍 ${item.lugar}</div>
          </div>
          <div class="card-footer">
            <span class="badge-price">${item.precio || 'Consultar'}</span>
            <a href="${item.url}" target="_blank" rel="noopener" class="btn-link">🔗 Ver evento</a>
          </div>
        </div>
      `).join('');
    }

    function formatFechaDisplay(fechaStr, diaStr) {
      if (!fechaStr) return 'Fecha por confirmar';
      const parts = fechaStr.split('-');
      if (parts.length < 3) return fechaStr;
      return `${diaStr ? diaStr + ', ' : ''}${parts[2]}/${parts[1]}/${parts[0]}`;
    }
  </script>
