name: Actualizador de Agenda Cultural

on:
  schedule:
    # Se ejecuta todos los días a las 04:00 UTC (06:00 AM hora de Terrassa)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite ejecutar la automatización manualmente con un clic en GitHub

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Ejecutar el scraper
        run: python scraper.py

      - name: Comprobar cambios y actualizar GitHub
        run: |
          git config --global user.name "Bot Agenda Terrassa"
          git config --global user.email "bot@github.com"
          git add index.html
          # Si hay cambios en index.html hace el commit y push automáticamente
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de eventos" && git push)
